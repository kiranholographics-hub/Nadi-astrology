# Nginx site config (VPS). Replace the domain, then:
#   sudo cp nginx.conf /etc/nginx/sites-available/ptrs && sudo ln -s /etc/nginx/sites-available/ptrs /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d nadiastrologerindia.com -d www.nadiastrologerindia.com   (free SSL)
server {
    listen 80;
    server_name nadiastrologerindia.com www.nadiastrologerindia.com;

    client_max_body_size 25m;   # floor plans / thumb photos (app limit is 10 MB per file)

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
